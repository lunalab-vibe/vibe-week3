<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀 메모장</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      background: linear-gradient(135deg, #2b2b3c 0%, #3a3a52 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
      color: #e8e8f0;
    }
    .card {
      background: #33334a;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 460px;
      padding: 32px 28px;
    }
    h1 { font-size: 1.4rem; text-align: center; margin-bottom: 20px; color: #cbb7e0; }
    input, textarea, button {
      font-family: inherit;
      font-size: 0.95rem;
      border-radius: 12px;
      border: 1px solid #4a4a66;
      padding: 12px 14px;
      width: 100%;
      background: #2b2b3c;
      color: #e8e8f0;
    }
    input:focus, textarea:focus { outline: none; border-color: #9a7fc4; }
    button {
      background: #7e6b9f;
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }
    button:hover { background: #6d5a8e; }
    .row { display: flex; gap: 8px; }
    .row textarea { flex: 1; }
    .row button { width: auto; margin-top: 0; white-space: nowrap; }
    #notes { list-style: none; margin-top: 18px; }
    #notes li {
      background: #2b2b3c;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    .hidden { display: none; }
    .hint { font-size: 0.8rem; color: #9a9ab0; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <!-- ===== 잠금 화면 ===== -->
    <div id="lockScreen">
      <h1 id="lockTitle">🔒 비밀 메모장</h1>
      <input type="password" id="pwInput" placeholder="비밀번호를 입력하세요" />
      <button id="unlockBtn">잠금 해제</button>
      <p class="hint" id="lockHint">보안 실습용 페이지입니다</p>
    </div>

    <!-- ===== 메모장 화면 ===== -->
    <div id="memoScreen" class="hidden">
      <h1>📝 나의 비밀 메모</h1>
      <div class="row">
        <textarea id="memoInput" rows="2" placeholder="메모를 입력하세요"></textarea>
        <button id="addBtn">추가</button>
      </div>
      <ul id="notes"></ul>
    </div>
  </div>

  <script>
    // ✅ 수정 ①: 비밀번호를 코드에 하드코딩하지 않는다.
    //    첫 실행 때 사용자가 직접 비밀번호를 정하고, 평문이 아닌 SHA-256 해시로만
    //    localStorage에 보관한다. 소스에는 어떤 비밀번호도 남지 않는다.
    const STORE_KEY = 'secretMemo.pwHash';

    const lockScreen = document.getElementById('lockScreen');
    const memoScreen = document.getElementById('memoScreen');
    const lockTitle = document.getElementById('lockTitle');
    const lockHint = document.getElementById('lockHint');
    const pwInput = document.getElementById('pwInput');
    const unlockBtn = document.getElementById('unlockBtn');
    const memoInput = document.getElementById('memoInput');
    const addBtn = document.getElementById('addBtn');
    const notes = document.getElementById('notes');

    // 비밀번호를 SHA-256 해시 문자열로 변환 (평문을 저장/비교하지 않기 위함)
    async function hash(text) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    }

    const isFirstRun = () => !localStorage.getItem(STORE_KEY);

    // 첫 실행 여부에 따라 '비밀번호 설정' / '잠금 해제' 화면을 구성
    function renderLock() {
      if (isFirstRun()) {
        lockTitle.textContent = '🔐 비밀번호 설정';
        pwInput.placeholder = '사용할 비밀번호를 정하세요';
        unlockBtn.textContent = '설정';
        lockHint.textContent = '첫 실행입니다. 사용할 비밀번호를 직접 정하세요.';
      } else {
        lockTitle.textContent = '🔒 비밀 메모장';
        pwInput.placeholder = '비밀번호를 입력하세요';
        unlockBtn.textContent = '잠금 해제';
        lockHint.textContent = '보안 실습용 페이지입니다';
      }
    }

    function openMemo() {
      lockScreen.classList.add('hidden');
      memoScreen.classList.remove('hidden');
    }

    async function submitPassword() {
      const entered = pwInput.value;
      if (!entered) { pwInput.focus(); return; }

      // ✅ 수정 ③: 비밀번호 관련 값을 콘솔에 출력하지 않는다.
      if (isFirstRun()) {
        // 첫 실행: 사용자가 정한 비밀번호의 해시를 저장한 뒤 바로 입장
        localStorage.setItem(STORE_KEY, await hash(entered));
        pwInput.value = '';
        openMemo();
      } else {
        // 이후 실행: 저장된 해시와 입력값의 해시를 비교
        const ok = (await hash(entered)) === localStorage.getItem(STORE_KEY);
        if (ok) {
          pwInput.value = '';
          openMemo();
        } else {
          alert('비밀번호가 틀렸습니다.');
        }
      }
    }

    function addNote() {
      const text = memoInput.value.trim();
      if (!text) return;

      const li = document.createElement('li');

      // ✅ 수정 ②: 사용자 입력을 innerHTML이 아닌 textContent로 넣어 자동 escape.
      //    <img src=x onerror=...> 같은 입력도 문자열 그대로 표시되어 실행되지 않는다.
      li.textContent = text;

      notes.appendChild(li);
      memoInput.value = '';
      memoInput.focus();
    }

    unlockBtn.addEventListener('click', submitPassword);
    pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitPassword(); });
    addBtn.addEventListener('click', addNote);

    renderLock();
  </script>
</body>
</html>
