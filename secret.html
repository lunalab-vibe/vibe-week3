<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀 메모장</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      background: linear-gradient(135deg, #2b2b3c 0%, #3a3a52 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
      color: #e8e8f0;
    }
    .card {
      background: #33334a;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 460px;
      padding: 32px 28px;
    }
    h1 { font-size: 1.4rem; text-align: center; margin-bottom: 20px; color: #cbb7e0; }
    input, textarea, button {
      font-family: inherit;
      font-size: 0.95rem;
      border-radius: 12px;
      border: 1px solid #4a4a66;
      padding: 12px 14px;
      width: 100%;
      background: #2b2b3c;
      color: #e8e8f0;
    }
    input:focus, textarea:focus { outline: none; border-color: #9a7fc4; }
    button {
      background: #7e6b9f;
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }
    button:hover { background: #6d5a8e; }
    .row { display: flex; gap: 8px; }
    .row textarea { flex: 1; }
    .row button { width: auto; margin-top: 0; white-space: nowrap; }
    #notes { list-style: none; margin-top: 18px; }
    #notes li {
      background: #2b2b3c;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    .hidden { display: none; }
    .hint { font-size: 0.8rem; color: #9a9ab0; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <!-- ===== 잠금 화면 ===== -->
    <div id="lockScreen">
      <h1>🔒 비밀 메모장</h1>
      <input type="password" id="pwInput" placeholder="비밀번호를 입력하세요" />
      <button id="unlockBtn">잠금 해제</button>
      <p class="hint">보안 실습용 페이지입니다</p>
    </div>

    <!-- ===== 메모장 화면 ===== -->
    <div id="memoScreen" class="hidden">
      <h1>📝 나의 비밀 메모</h1>
      <div class="row">
        <textarea id="memoInput" rows="2" placeholder="메모를 입력하세요"></textarea>
        <button id="addBtn">추가</button>
      </div>
      <ul id="notes"></ul>
    </div>
  </div>

  <script>
    // ⚠️ 실습용 취약점 ①: 비밀번호를 코드에 하드코딩
    //    → 브라우저에서 소스만 봐도 비밀번호가 그대로 노출된다.
    const PASSWORD = '1234';

    const lockScreen = document.getElementById('lockScreen');
    const memoScreen = document.getElementById('memoScreen');
    const pwInput = document.getElementById('pwInput');
    const unlockBtn = document.getElementById('unlockBtn');
    const memoInput = document.getElementById('memoInput');
    const addBtn = document.getElementById('addBtn');
    const notes = document.getElementById('notes');

    function unlock() {
      const entered = pwInput.value;
      const ok = entered === PASSWORD;

      // ⚠️ 실습용 취약점 ③: 비밀번호 확인 결과를 콘솔에 출력
      //    → 입력한 비밀번호와 정답 여부가 개발자 콘솔에 그대로 찍힌다.
      console.log('입력한 비밀번호:', entered, '/ 정답 여부:', ok, '/ 실제 비밀번호:', PASSWORD);

      if (ok) {
        lockScreen.classList.add('hidden');
        memoScreen.classList.remove('hidden');
      } else {
        alert('비밀번호가 틀렸습니다.');
      }
    }

    function addNote() {
      const text = memoInput.value.trim();
      if (!text) return;

      const li = document.createElement('li');

      // ⚠️ 실습용 취약점 ②: 사용자 입력을 escape 없이 innerHTML로 삽입
      //    → <img src=x onerror=...> 같은 입력이 그대로 실행되는 XSS 취약점.
      li.innerHTML = text;

      notes.appendChild(li);
      memoInput.value = '';
      memoInput.focus();
    }

    unlockBtn.addEventListener('click', unlock);
    pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
    addBtn.addEventListener('click', addNote);
  </script>
</body>
</html>
